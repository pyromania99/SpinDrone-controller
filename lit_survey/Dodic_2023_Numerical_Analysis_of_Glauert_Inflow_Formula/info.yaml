abstract: This article addresses the numerical computation problem of induced inflow ratio based on the helicopter momentum theory in forward flight. The Glauert inflow formula (equation) is a nonlinear equation usually solved by the Newton–Raphson method in a relatively small number of iterations. However, many high-order convergence multipoint iterative methods have been developed over the last decade. The study examines several selected methods in terms of finding ones that provide a solution in only one iteration with acceptable accuracy. Furthermore, the influence of initial guesses on the accuracy of the obtained solutions has been investigated. In this regard, the practical range of parameters of the Glauert inflow equation for helicopters in forward flight is roughly determined by simplified modeling of a power and stall-flutter limitation. For these purposes, a basic low-fidelity longitudinal trim model of a single-rotor helicopter in steady-level flight is modified and numerically solved by a symbolic transformation of a system of 20+ nonlinear equations into a single nonlinear equation.
